[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legalrag"
version = "0.6.5"
description = "RAG-based legal document analysis to narrow the access-to-justice gap"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch",
    "transformers",
    "faiss-cpu",
    "joblib",
    "pypdfium2",
    "python-docx",
]

[project.optional-dependencies]
slm = [
    "llama-cpp-python",
    "gguf",
    "sentencepiece",
    "peft",
    "bitsandbytes",
]
ocr = ["rapidocr"]

[project.scripts]
themis = "legalrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]